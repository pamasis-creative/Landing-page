<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123d2d"><title>PAMASIS | Team Inbox</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><style>
:root{--g:#123d2d;--gold:#b18a45;--cream:#f6f2e9;--paper:#fffdf8;--ink:#1b2c23;--muted:#657168;--line:#dedbcf}*{box-sizing:border-box}body{margin:0;background:#f3f1ea;color:var(--ink);font:14px "DM Sans",sans-serif}.top{background:var(--g);color:white;padding:17px 24px;display:flex;justify-content:space-between;align-items:center}.top strong{font:800 18px Manrope;letter-spacing:.1em}.wrap{max-width:1200px;margin:28px auto;padding:0 18px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:22px;box-shadow:0 8px 30px #0924190b}.login{max-width:420px;margin:8vh auto}.grid{display:grid;grid-template-columns:360px 1fr;gap:16px}.list{max-height:72vh;overflow:auto}.item{padding:14px;border-bottom:1px solid var(--line);cursor:pointer}.item.active{background:var(--cream);border-left:3px solid var(--gold)}.item strong{display:block;color:var(--g)}.muted{color:var(--muted);font-size:12px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.pill{font-size:11px;padding:4px 8px;background:var(--cream);border-radius:99px}.field{width:100%;padding:12px;border:1px solid var(--line);border-radius:6px;font:14px "DM Sans"}.btn{border:0;background:var(--g);color:white;padding:11px 15px;border-radius:6px;font-weight:700;cursor:pointer}.btn.alt{background:#eee9dd;color:var(--g)}.messages{height:48vh;overflow:auto;background:#faf8f2;border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:9px}.msg{max-width:80%;padding:10px 12px;border-radius:9px;background:#eae8df;white-space:pre-wrap;overflow-wrap:anywhere}.msg.staff{align-self:flex-end;background:var(--g);color:white}.msg.system{max-width:100%;background:#fbf4e4}.compose{display:flex;gap:8px;margin-top:12px}.compose textarea{flex:1;resize:vertical;min-height:44px}.detail{display:grid;grid-template-columns:1fr 230px;gap:14px}.hide{display:none!important}label{display:grid;gap:6px;margin:12px 0}h2{font:700 22px Manrope;color:var(--g);margin:0 0 14px}@media(max-width:800px){.grid,.detail{grid-template-columns:1fr}.list{max-height:34vh}.messages{height:38vh}}
</style></head><body><header class="top"><strong>PAMASIS <span style="font:500 12px 'DM Sans'">TEAM INBOX</span></strong><button id="logout" class="btn alt hide">Sign out</button></header><main class="wrap"><section id="login" class="panel login"><h2>Team sign in</h2><p class="muted">Use your PAMASIS team account.</p><form id="loginForm"><label>Email<input class="field" type="email" id="email" required autocomplete="username"></label><label>Password<input class="field" type="password" id="password" required autocomplete="current-password"></label><button class="btn" type="submit">Sign in</button><p id="loginError" class="muted"></p></form></section><section id="app" class="grid hide"><aside class="panel"><div class="row"><h2>Conversations</h2><button id="refresh" class="btn alt">Refresh</button></div><p class="muted" id="inboxCount">Loading…</p><div id="inbox" class="list"></div></aside><section class="panel"><div id="empty"><h2>Select a conversation</h2><p class="muted">New enquiries will appear here.</p></div><div id="conversation" class="hide"><div class="row"><div><h2 id="leadName">Conversation</h2><div id="leadInfo" class="muted"></div></div><select id="status" class="field" style="max-width:150px"><option value="new">New</option><option value="open">Open</option><option value="waiting">Waiting</option><option value="resolved">Resolved</option><option value="closed">Closed</option></select></div><div class="detail" style="margin:14px 0"><div id="messages" class="messages"></div><aside><strong>Business profile</strong><div id="profile" class="muted" style="line-height:1.8;margin-top:8px"></div><label>Assign to<select id="assignee" class="field"><option value="">Unassigned</option></select></label><button id="assign" class="btn alt">Save assignment</button></aside></div><form id="replyForm" class="compose"><textarea id="reply" class="field" placeholder="Write a reply…" required maxlength="5000"></textarea><button class="btn" type="submit">Send</button></form></div></section></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./campaign-config.js"></script><script>
(()=>{const cfg=window.PAMASIS_CMS_CONFIG,supabase=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey),endpoint=cfg.supabaseUrl.replace(/\/$/,"")+"/functions/v1/pamasis-chat";let session=null,current=null,conversations=[],team=[],poll=null;
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(payload){const r=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json","apikey":cfg.supabaseAnonKey,"Authorization":"Bearer "+session.access_token},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok)throw new Error(d.error||"Request failed");return d;}
function notify(title,body){if("Notification"in window&&Notification.permission==="granted")new Notification(title,{body});}
async function loadTeam(){try{const d=await api({action:"team"});team=d.team||[];}catch(e){team=[];} $("assignee").innerHTML='<option value="">Unassigned</option>'+team.filter(x=>x.is_active).map(x=>'<option value="'+esc(x.user_id)+'">'+esc(x.display_name)+' · '+esc(x.role)+'</option>').join("");}
function lead(c){return Array.isArray(c.pamasis_leads)?c.pamasis_leads[0]:c.pamasis_leads||{};}
function renderInbox(){const el=$("inbox");el.innerHTML=conversations.map(c=>{const l=lead(c);return '<div class="item '+(current===c.id?"active":"")+'" data-id="'+c.id+'"><div class="row"><strong>'+esc(l.business_name||"New enquiry")+'</strong><span class="pill">'+esc(c.status)+'</span></div><div>'+esc(l.full_name||"")+'</div><div class="muted">'+esc(c.last_message_at?new Date(c.last_message_at).toLocaleString():"")+'</div></div>';}).join("")||'<p class="muted">No conversations yet.</p>';el.querySelectorAll("[data-id]").forEach(n=>n.onclick=()=>openConversation(n.dataset.id));$("inboxCount").textContent=conversations.length+" active conversations";}
async function loadInbox(){const d=await api({action:"inbox"});const previous=new Set(conversations.map(c=>c.id));conversations=d.conversations||[];const fresh=conversations.filter(c=>!previous.has(c.id));if(fresh.length)notify("New PAMASIS enquiry",fresh.length+" new conversation(s) received.");renderInbox();if(current&&!conversations.some(c=>c.id===current))current=null;}
async function openConversation(id){current=id;const c=conversations.find(x=>x.id===id);if(!c)return;const l=lead(c);$("empty").classList.add("hide");$("conversation").classList.remove("hide");$("leadName").textContent=l.business_name||"Enquiry";$("leadInfo").textContent=(l.full_name||"")+" · "+(l.phone||"")+" · "+(l.email||"");$("profile").innerHTML=['Name: '+esc(l.full_name),'Business: '+esc(l.business_name),'Type: '+esc(l.business_type||"Not provided"),'Location: '+esc([l.city,l.state].filter(Boolean).join(", ")||"Not provided"),'Interests: '+esc((l.interests||[]).join(", ")||"Not provided"),'Palm oil usage: '+esc(l.palm_oil_usage||"Not provided")].join("<br>");$("status").value=c.status;$("assignee").value=c.assigned_to||"";renderInbox();await loadMessages();}
async function loadMessages(){if(!current)return;const d=await api({action:"staff_history",conversation_id:current});$("messages").innerHTML=(d.messages||[]).map(m=>'<div class="msg '+(m.sender_type==="staff"?"staff":m.sender_type==="system"?"system":"")+'">'+esc(m.body)+'</div>').join("");$("messages").scrollTop=$("messages").scrollHeight;}
$("loginForm").onsubmit=async e=>{e.preventDefault();$("loginError").textContent="Signing in…";const {data,error}=await supabase.auth.signInWithPassword({email:$("email").value,password:$("password").value});if(error){$("loginError").textContent=error.message;return;}session=data.session;await startApp();};
async function startApp(){try{await api({action:"inbox"});$("login").classList.add("hide");$("app").classList.remove("hide");$("logout").classList.remove("hide");await loadTeam();await loadInbox();if(poll)clearInterval(poll);poll=setInterval(async()=>{try{await loadInbox();if(current)await loadMessages();}catch(e){}},6000);if("Notification"in window&&Notification.permission==="default")Notification.requestPermission();}catch(e){$("loginError").textContent=e.message;await supabase.auth.signOut();}}
$("refresh").onclick=()=>loadInbox().catch(e=>alert(e.message));
$("replyForm").onsubmit=async e=>{e.preventDefault();const body=$("reply").value.trim();if(!body||!current)return;try{await api({action:"staff_reply",conversation_id:current,body});$("reply").value="";await loadMessages();await loadInbox();}catch(e){alert(e.message);}};
$("assign").onclick=async()=>{if(!current)return;try{await api({action:"assign",conversation_id:current,assigned_to:$("assignee").value||null});await loadInbox();alert("Assignment updated.");}catch(e){alert(e.message);}};
$("status").onchange=async()=>{if(!current)return;try{await api({action:"set_status",conversation_id:current,status:$("status").value});await loadInbox();}catch(e){alert(e.message);}};
$("logout").onclick=async()=>{if(poll)clearInterval(poll);await supabase.auth.signOut();location.reload();};
supabase.auth.getSession().then(({data})=>{if(data.session){session=data.session;startApp();}});
})();
</script></body></html>
